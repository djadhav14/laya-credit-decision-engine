[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-credit-decision-engine"
version = "0.1.0"
description = "Governance-first credit decision engine: PostgreSQL decision matrix + pgvector policy RAG + Laya typed decisions"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
