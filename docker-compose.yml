# Local PostgreSQL 16 with pgvector. Data stays on this machine (data localisation).
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: laya-credit-pg
    environment:
      POSTGRES_DB: ${PG_DATABASE:-laya_credit}
      POSTGRES_USER: ${PG_USER:-laya}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-change_me_local_only}
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"   # bound to localhost only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-laya} -d ${PG_DATABASE:-laya_credit}"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
